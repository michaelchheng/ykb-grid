[project]
name = "ai-sports-video"
version = "0.1.0"
description = "Automated sports short-video pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.3.4",
  "requests>=2.32.3",
]

[project.optional-dependencies]
video = [
  "moviepy>=1.0.3",
]

[project.scripts]
sports-video = "sports_video_pipeline.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
